apiVersion: radix.equinor.com/v1
kind: RadixApplication
metadata:
  name: mini-app
spec:
  build:
    useBuildKit: true
  environments:
    - name: dev
      build:
        from: main
  components:
    - name: server
      identity:
        azure:
          clientId: "7ef841f8-a263-45ea-8993-683cc6817ae2"
      authentication:
        oauth2:
          clientId: "7ef841f8-a263-45ea-8993-683cc6817ae2"
          useAzureIdentity: false
      ports:
        - name: http
          port: 8080
      publicPort: http
