apiVersion: radix.equinor.com/v1
kind: RadixApplication
metadata:
  name: mini-app
spec:
  build:
    useBuildKit: true
  environments:
    - name: dev
      build:
        from: main
    - name: dev2
      build:
        from: main
    - name: dev3
      build:
        from: main
    - name: dev4
      build:
        from: main
  components:
    - name: server
      # identity:
      #   azure:
      #     clientId: "7ef841f8-a263-45ea-8993-683cc6817ae2"
      authentication:
        oauth2:
          clientId: "5e48ca1f-a2bf-4dec-b96d-bbf8ce69f9f6"
          credentials: azureWorkloadIdentity
          # credentials: secret
      ports:
        - name: http
          port: 8080
      publicPort: http
      replicas: 2
      environmentConfig:
      - environment: dev
        replicas: 3
      - environment: dev2
        replicas: 4
      - environment: dev3
    - name: server2
      environmentConfig:
      - environment: dev
        replicas: 3
      - environment: dev2
        replicas: 4
      - environment: dev3
